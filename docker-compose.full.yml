# The whole system on one machine: database, migrations, API, worker, mock
# payment provider, Prometheus and Grafana. (docker-compose.yml stays the
# dev-only database for `npm run dev` / `npm test`.)
#
#   npm run stack:up        build images, start everything, wait until healthy
#   npm run stack:down      stop (data kept in the ledger_full_pgdata volume)
#
#   API          http://localhost:3000   (/healthz /readyz; /metrics is internal, port 9100)
#   Grafana      http://localhost:3001   (anonymous read-only; dashboard "Ledger")
#   Prometheus   http://localhost:9090
#   Mock provider http://localhost:4100
#
# On demand (profile "tools"):
#   docker compose -f docker-compose.full.yml run --rm reconcile
#   docker compose -f docker-compose.full.yml run --rm -T seed > load/out/accounts.json
#   docker compose -f docker-compose.full.yml run --rm k6
#   load/outbox-drain-bench.sh 1 2 4 8      (how fast the events lane drains, per concurrency)
#
# Every password and secret below is a LOCAL-ONLY default. Nothing is baked into
# the images; real environments inject real values (Kubernetes Secrets, step 6b).
# Memory limits keep the stack well inside Docker Desktop's VM on an 8 GB Mac.

name: ledger-full

# Every ledger service runs the SAME image with a different command. Only
# `migrate` (which runs first) builds it; the others use the tag and must
# never try to pull it from a registry.
x-ledger-image: &ledger-image
  image: ledger-service:local
  pull_policy: never

x-db-urls:
  # documented here, used below
  app: &app-url postgres://ledger_app:ledger_app_local@postgres:5432/ledger
  owner: &owner-url postgres://ledger_owner:ledger_owner_local@postgres:5432/ledger
  worker: &worker-url postgres://ledger_worker:ledger_worker_local@postgres:5432/ledger
  reconciler: &reconciler-url postgres://ledger_reconciler:ledger_reconciler_local@postgres:5432/ledger
  agent: &agent-url postgres://ledger_agent:ledger_agent_local@postgres:5432/ledger

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    # Small on purpose (this runs next to everything else on a laptop).
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=100"]
    volumes:
      - ledger_full_pgdata:/var/lib/postgresql/data
      - ./k8s/base/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ledger"]
      interval: 2s
      timeout: 3s
      retries: 30
    mem_limit: 512m

  # Runs once and exits. api and the workers start only after it succeeded.
  migrate:
    image: ledger-service:local
    build:
      context: .
      target: app
    command: ["node", "dist/scripts/migrate.js"]
    environment:
      OWNER_DATABASE_URL: *owner-url
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    mem_limit: 128m

  api:
    <<: *ledger-image
    command: ["node", "dist/src/server.js"]
    environment:
      DATABASE_URL: *app-url
      PORT: "3000"
      # /metrics only on this internal port: not published to the host, only
      # Prometheus (on the compose network) scrapes it.
      METRICS_PORT: "9100"
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-local-compose-webhook-secret-not-for-production}
      # Step 7d: /system/status, reconcile-now and the chaos slot on the internal
      # port read and record as ledger_reconciler (never as the API's own role).
      RECONCILER_DATABASE_URL: *reconciler-url
      SERVICE_NAME: api
      LOG_LEVEL: info
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # busybox wget ships with the alpine base image.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/readyz >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
    # Must exceed SHUTDOWN_GRACE_MS (25 s) so in-flight requests can finish.
    stop_grace_period: 30s
    restart: unless-stopped
    mem_limit: 256m

  # The outbox worker runs as TWO services, one per lane (see src/worker/lanes.ts):
  #   worker-commands  provider.* rows: a user is waiting; never stuck behind events
  #   worker-events    notifications: bulk; scaled with WORKER_EVENTS_CONCURRENCY loops
  # A slow or dead notification sink can therefore never delay a payment.
  # Same image, same code; only WORKER_LANE / WORKER_CONCURRENCY differ.
  worker-commands:
    <<: *ledger-image
    command: ["node", "dist/src/worker/main.js"]
    environment: &worker-env
      WORKER_DATABASE_URL: *worker-url
      PROVIDER_URL: http://mock-provider:4100
      NOTIFICATION_SINK_URL: http://mock-provider:4100/notifications
      WORKER_HTTP_PORT: "9101"
      WORKER_POLL_INTERVAL_MS: "250"
      WORKER_LANE: commands
      WORKER_CONCURRENCY: ${WORKER_COMMANDS_CONCURRENCY:-1}
      SERVICE_NAME: worker-commands
      LOG_LEVEL: info
    # No host port: Prometheus reaches it on the compose network.
    depends_on: &worker-deps
      migrate:
        condition: service_completed_successfully
      mock-provider:
        condition: service_started
    healthcheck: &worker-health
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9101/readyz >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
    stop_grace_period: 30s
    restart: unless-stopped
    mem_limit: 192m

  worker-events:
    <<: *ledger-image
    command: ["node", "dist/src/worker/main.js"]
    environment:
      <<: *worker-env
      WORKER_LANE: events
      WORKER_CONCURRENCY: ${WORKER_EVENTS_CONCURRENCY:-4}
      SERVICE_NAME: worker-events
    depends_on: *worker-deps
    healthcheck: *worker-health
    stop_grace_period: 30s
    restart: unless-stopped
    mem_limit: 192m

  mock-provider:
    image: ledger-mock-provider:local
    build:
      context: .
      target: mock-provider
    environment:
      PROVIDER_PORT: "4100"
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-local-compose-webhook-secret-not-for-production}
      LEDGER_WEBHOOK_URL: http://api:3000/webhooks/provider
    ports:
      - "4100:4100"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4100/healthz >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    mem_limit: 96m

  # The assistant service (step 7a: probes and read-only tools, no model yet).
  # Its own image (Python), its own database role: ledger_agent, SELECT on views
  # only, row-filtered to the client of each request.
  agent:
    image: ledger-agent:local
    build:
      context: ./agent
    environment:
      AGENT_DATABASE_URL: *agent-url
      PORT: "8000"
      # From your shell or the repo's .env. Without a key, /ask answers 503;
      # the probes still work.
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      AGENT_MODEL: ${AGENT_MODEL:-gemini-3.5-flash-lite}
      AGENT_EMBEDDING_MODEL: ${AGENT_EMBEDDING_MODEL:-gemini-embedding-2}
      AGENT_DAILY_LIMIT: ${AGENT_DAILY_LIMIT:-20}
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # python:slim has no curl or wget; python itself is the probe.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    # LangChain, LangGraph and the Google client roughly double the 7a footprint.
    mem_limit: 320m

  # On demand: embed agent/policies/*.md into policy_chunks (idempotent).
  #   docker compose -f docker-compose.full.yml run --rm agent-ingest
  # A separate service because it writes as ledger_owner: the long-running
  # agent never holds the owner's credentials.
  agent-ingest:
    image: ledger-agent:local
    pull_policy: never
    profiles: ["tools"]
    command: ["python", "scripts/ingest_policies.py"]
    environment:
      AGENT_DATABASE_URL: *agent-url
      OWNER_DATABASE_URL: *owner-url
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      AGENT_EMBEDDING_MODEL: ${AGENT_EMBEDDING_MODEL:-gemini-embedding-2}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"
    mem_limit: 320m

  prometheus:
    image: prom/prometheus:v3.15.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=6h
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - api
      - worker-commands
      - worker-events
    restart: unless-stopped
    mem_limit: 256m

  grafana:
    image: grafana/grafana:12.4.15
    environment:
      # Local only: anyone on this machine may VIEW dashboards without logging in.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin-local-only}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/ledger.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      # Single copy, shared with Kubernetes (step 6b): the files live under k8s/.
      - ./k8s/base/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./k8s/base/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    restart: unless-stopped
    mem_limit: 256m

  # Step 7d: the web app. The browser talks ONLY to this server; it adds
  # X-Client-Id and calls the API (public and internal ports), the assistant and
  # the mock provider on the compose network. http://localhost:3200
  web:
    image: ledger-web:local
    build:
      context: ./web
    environment:
      LEDGER_API_URL: http://api:3000
      LEDGER_INTERNAL_URL: http://api:9100
      AGENT_URL: http://agent:8000
      PROVIDER_URL: http://mock-provider:4100
      GRAFANA_URL: http://localhost:3001
      PROMETHEUS_URL: http://localhost:9090/targets
      # 'agent' (default, step 7g): free text goes to the live assistant, inside the
      # limits below (Redis). No GOOGLE_API_KEY, over the quota or Redis down: a
      # labelled scripted answer. 'fixtures': the script answers everything.
      ASSISTANT_MODE: ${ASSISTANT_MODE:-agent}
      REDIS_URL: redis://redis:6379
      ASSISTANT_BURST: ${ASSISTANT_BURST:-5}
      ASSISTANT_REFILL_SECONDS: ${ASSISTANT_REFILL_SECONDS:-180}
      ASSISTANT_DAILY_CAP: ${ASSISTANT_DAILY_CAP:-40}
      SESSION_SECRET: ${WEB_SESSION_SECRET:-local-compose-session-secret-not-for-production}
      # No RECONCILE_SCHEDULE: nothing runs reconciliation on a schedule in compose,
      # so the pages do not claim that anything does.
    ports:
      - "3200:3200"
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3200/api/healthz >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    mem_limit: 256m

  # The live assistant's rate limiter (step 7g). Counters only: no persistence, and no
  # published port (only the web container uses it).
  redis:
    image: redis:8.10.3-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "16mb", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    mem_limit: 48m

  # ── On-demand tools ──

  reconcile:
    <<: *ledger-image
    profiles: ["tools"]
    command: ["node", "dist/src/reconcile/main.js", "--out", "/tmp/reconcile-report.json"]
    environment:
      RECONCILER_DATABASE_URL: *reconciler-url
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"
    mem_limit: 128m

  seed:
    <<: *ledger-image
    profiles: ["tools"]
    command: ["node", "dist/scripts/seed-load.js"]
    environment:
      OWNER_DATABASE_URL: *owner-url
      LOAD_ACCOUNTS: "10"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"
    mem_limit: 128m

  # The web demo's fictional people (step 7d), once:
  #   docker compose -f docker-compose.full.yml run --rm seed-demo
  seed-demo:
    <<: *ledger-image
    profiles: ["tools"]
    command: ["node", "dist/scripts/seed-demo.js"]
    environment:
      OWNER_DATABASE_URL: *owner-url
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"
    mem_limit: 128m

  k6:
    image: grafana/k6:1.8.2
    profiles: ["tools"]
    working_dir: /load
    volumes:
      - ./load:/load
    environment:
      API_URL: http://api:3000
      PROVIDER_URL: http://mock-provider:4100
      VUS: ${K6_VUS:-20}
      DURATION: ${K6_DURATION:-2m}
    command: ["run", "--summary-export=/load/out/summary.json", "/load/transfers.js"]
    depends_on:
      - api
    mem_limit: 256m

volumes:
  ledger_full_pgdata:
