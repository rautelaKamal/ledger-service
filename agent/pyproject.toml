[project]
name = "ledger-agent"
version = "0.1.0"
description = "The ledger's AI assistant service (step 7): read-only, typed tools over views, one client per request"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "pydantic>=2.9",
    # Step 7b: the assistant. Exact versions checked on PyPI, 2026-11-16.
    "langchain==1.5.0",
    "langchain-core==1.8.1",
    "langgraph==1.2.22",
    "langchain-google-genai==4.5.0",
    "langsmith==0.14.17",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.uv]
# An application, not a library: nothing to build or install, only dependencies.
package = false

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
# Data tables: one eval item or seed row per line reads better than wrapped literals.
"eval/questions.py" = ["E501"]
"eval/seed.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["ledger_agent", "tests", "scripts", "eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Any LangSmith call to a deprecated endpoint (removed after 31 Jan 2027) fails the test that made it.
filterwarnings = ["error:.*is deprecated and will be removed after:DeprecationWarning"]
