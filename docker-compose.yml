services:
  postgres:
    # pgvector image = normal Postgres 17 + the pgvector extension available
    # (not enabled yet; a later step will run CREATE EXTENSION).
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      # Host port is configurable in case 5432 is taken by another project.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Named volume: data survives `docker compose down`, is wiped by `down -v`.
      - ledger_pgdata:/var/lib/postgresql/data
      # Files here run ONCE, only when the data volume is empty.
      - ./k8s/base/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Healthy = the server accepts connections to the ledger database.
      test: ["CMD-SHELL", "pg_isready -U postgres -d ledger"]
      interval: 2s
      timeout: 3s
      retries: 30

  # The web app's rate limiter for the live assistant (step 7g): counters with an
  # expiry and nothing worth keeping, so no persistence. Bound to localhost: it has
  # no password, and only the web server on this machine needs it.
  redis:
    image: redis:8.10.3-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "32mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  ledger_pgdata:
