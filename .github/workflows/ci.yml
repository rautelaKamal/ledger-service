name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # Service containers start BEFORE the repo is checked out, so they cannot
    # mount k8s/base/postgres/init/00-roles.sql. We run that file with psql in a step instead.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres # throwaway CI-only container
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    env:
      # CI-only values; they match k8s/base/postgres/init/00-roles.sql. Tests use ledger_test.
      DATABASE_URL: postgres://ledger_app:ledger_app_local@localhost:5432/ledger_test
      OWNER_DATABASE_URL: postgres://ledger_owner:ledger_owner_local@localhost:5432/ledger_test
      WORKER_DATABASE_URL: postgres://ledger_worker:ledger_worker_local@localhost:5432/ledger_test
      RECONCILER_DATABASE_URL: postgres://ledger_reconciler:ledger_reconciler_local@localhost:5432/ledger_test
      AGENT_DATABASE_URL: postgres://ledger_agent:ledger_agent_local@localhost:5432/ledger_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create roles and databases (as postgres superuser)
        env:
          PGPASSWORD: postgres
        run: psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -f k8s/base/postgres/init/00-roles.sql

      - name: Run migrations against ledger_test
        run: npm run migrate

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  # A broken Dockerfile must fail CI, not the first deploy. Builds both images
  # (no push) and smoke-checks them.
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the ledger image (no push)
        run: docker build --target app -t ledger-service:ci .

      - name: Build the mock provider image (no push)
        run: docker build --target mock-provider -t ledger-mock-provider:ci .

      - name: Build the web image (no push)
        run: docker build -t ledger-web:ci web/

      - name: Smoke-check the images
        run: |
          set -eu
          # All run as the non-root `node` user.
          test "$(docker run --rm --entrypoint id ledger-service:ci -u)" = "1000"
          test "$(docker run --rm --entrypoint id ledger-mock-provider:ci -u)" = "1000"
          test "$(docker run --rm --entrypoint id ledger-web:ci -u)" = "1000"
          # No env files made it into any image.
          for img in ledger-service:ci ledger-mock-provider:ci ledger-web:ci; do
            found=$(docker run --rm --user root --entrypoint sh "$img" -c 'find / -xdev -name ".env*" 2>/dev/null | grep -v "^/proc" || true')
            test -z "$found" || { echo "env file in $img: $found"; exit 1; }
          done
          # The compiled entry points load with only production dependencies.
          docker run --rm --entrypoint node ledger-service:ci --input-type=module -e "await import('/app/dist/src/app.js'); await import('/app/dist/src/worker/handlers.js'); await import('/app/dist/src/reconcile/run.js'); console.log('modules load')"

  # The web app (web/): types, build, and Playwright against the real stack
  # (API, worker, mock provider, started by Playwright) on a fresh database with
  # the demo people: the flows, Lighthouse accessibility, and every screen in
  # both themes through axe. The assistant runs in 'fixtures' mode: no model call.
  web:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres # throwaway CI-only container
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      CI: "true"
      DATABASE_URL: postgres://ledger_app:ledger_app_local@localhost:5432/ledger_e2e
      OWNER_DATABASE_URL: postgres://ledger_owner:ledger_owner_local@localhost:5432/ledger_e2e
      WORKER_DATABASE_URL: postgres://ledger_worker:ledger_worker_local@localhost:5432/ledger_e2e
      RECONCILER_DATABASE_URL: postgres://ledger_reconciler:ledger_reconciler_local@localhost:5432/ledger_e2e
      WEBHOOK_SECRET: ci-webhook-secret-not-for-production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Install the ledger's dependencies (API, worker, mock provider)
        run: npm ci
      - name: Create roles and databases (as postgres superuser)
        env:
          PGPASSWORD: postgres
        run: psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -f k8s/base/postgres/init/00-roles.sql
      - name: Create ledger_e2e, the only database the browser tests may write to
        env:
          PGPASSWORD: postgres
        run: |
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres <<'SQL'
          CREATE DATABASE ledger_e2e OWNER ledger_owner;
          REVOKE CONNECT ON DATABASE ledger_e2e FROM PUBLIC;
          GRANT CONNECT ON DATABASE ledger_e2e TO ledger_owner, ledger_app, ledger_worker, ledger_reconciler, ledger_agent;
          \connect ledger_e2e
          CREATE EXTENSION IF NOT EXISTS vector;
          SQL
      - name: Migrate and seed the demo people
        run: npm run migrate && npm run seed:demo

      - name: Install the web app's dependencies
        run: npm ci
        working-directory: web
      - name: Policy excerpts match agent/policies word for word
        run: npm run check:policies
        working-directory: web
      - name: Typecheck (TypeScript 7)
        run: npm run typecheck
        working-directory: web
      - name: Lint (typescript-eslint, on the TypeScript 6 API; no warnings allowed)
        run: npm run lint
        working-directory: web
      - name: Build
        run: npx next build
        working-directory: web
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Playwright (flows, Lighthouse, every screen through axe)
        run: npx playwright test
        working-directory: web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7

  # The assistant service (agent/): lint, format, types, and its tests against
  # the real, migrated database as ledger_agent.
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres # throwaway CI-only container
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      OWNER_DATABASE_URL: postgres://ledger_owner:ledger_owner_local@localhost:5432/ledger_test
      AGENT_DATABASE_URL: postgres://ledger_agent:ledger_agent_local@localhost:5432/ledger_test
    steps:
      - uses: actions/checkout@v4

      # The migrations are TypeScript: node runs them, then Python takes over.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies (for the migration runner)
        run: npm ci
        working-directory: .
      - name: Create roles and databases (as postgres superuser)
        env:
          PGPASSWORD: postgres
        run: psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -f k8s/base/postgres/init/00-roles.sql
        working-directory: .
      - name: Run migrations against ledger_test
        run: npm run migrate
        working-directory: .

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.8"
      - name: Install (exactly uv.lock)
        run: uv sync --frozen
      - name: Lint and format
        run: uv run ruff check . && uv run ruff format --check .
      - name: Types
        run: uv run mypy
      - name: Test
        run: uv run pytest

  # The Kubernetes manifests, without a cluster: kustomize must render, every
  # object must match the API schema (strict: unknown fields fail), and no
  # Secret may be tracked. See scripts/k8s/validate.sh.
  k8s-validate:
    runs-on: ubuntu-latest
    env:
      KUBECONFORM_VERSION: v0.8.0
      KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
    steps:
      - uses: actions/checkout@v4

      - name: Install kubeconform (pinned, checksum verified)
        run: |
          set -eu
          curl -fsSL -o kubeconform.tar.gz "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform.tar.gz" | sha256sum -c -
          tar xzf kubeconform.tar.gz kubeconform
          sudo mv kubeconform /usr/local/bin/kubeconform
          kubectl version --client
          kubeconform -v

      - name: Validate manifests
        run: scripts/k8s/validate.sh
