name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # Service containers start BEFORE the repo is checked out, so they cannot
    # mount db/init/00-roles.sql. We run that file with psql in a step instead.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres # throwaway CI-only container
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    env:
      # CI-only values; they match db/init/00-roles.sql. Tests use ledger_test.
      DATABASE_URL: postgres://ledger_app:ledger_app_local@localhost:5432/ledger_test
      OWNER_DATABASE_URL: postgres://ledger_owner:ledger_owner_local@localhost:5432/ledger_test
      WORKER_DATABASE_URL: postgres://ledger_worker:ledger_worker_local@localhost:5432/ledger_test
      RECONCILER_DATABASE_URL: postgres://ledger_reconciler:ledger_reconciler_local@localhost:5432/ledger_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create roles and databases (as postgres superuser)
        env:
          PGPASSWORD: postgres
        run: psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -f db/init/00-roles.sql

      - name: Run migrations against ledger_test
        run: npm run migrate

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  # A broken Dockerfile must fail CI, not the first deploy. Builds both images
  # (no push) and smoke-checks them.
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the ledger image (no push)
        run: docker build --target app -t ledger-service:ci .

      - name: Build the mock provider image (no push)
        run: docker build --target mock-provider -t ledger-mock-provider:ci .

      - name: Smoke-check the images
        run: |
          set -eu
          # Both run as the non-root `node` user.
          test "$(docker run --rm --entrypoint id ledger-service:ci -u)" = "1000"
          test "$(docker run --rm --entrypoint id ledger-mock-provider:ci -u)" = "1000"
          # No env files made it into either image.
          for img in ledger-service:ci ledger-mock-provider:ci; do
            found=$(docker run --rm --user root --entrypoint sh "$img" -c 'find / -xdev -name ".env*" 2>/dev/null | grep -v "^/proc" || true')
            test -z "$found" || { echo "env file in $img: $found"; exit 1; }
          done
          # The compiled entry points load with only production dependencies.
          docker run --rm --entrypoint node ledger-service:ci --input-type=module -e "await import('/app/dist/src/app.js'); await import('/app/dist/src/worker/handlers.js'); await import('/app/dist/src/reconcile/run.js'); console.log('modules load')"
