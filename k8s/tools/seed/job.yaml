# Creates LOAD_ACCOUNTS funded user accounts and prints {"accounts":[...]} on
# stdout (scripts/seed-load.ts). scripts/k8s/seed.sh reads it from the logs.
apiVersion: batch/v1
kind: Job
metadata:
  name: seed
  labels:
    app: seed
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: seed
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: seed
          image: ledger-service
          imagePullPolicy: IfNotPresent
          command: ["node", "dist/scripts/seed-load.js"]
          env:
            - name: OWNER_DATABASE_URL
              valueFrom: { secretKeyRef: { name: ledger-secrets, key: OWNER_DATABASE_URL } }
            - name: LOAD_ACCOUNTS
              value: "10"
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
