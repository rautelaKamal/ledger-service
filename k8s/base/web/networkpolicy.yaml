# The web app is the public entry point, so anyone may reach its port 3200.
# What it may reach is fenced: the ledger API (3000, and its internal port 9100
# for the "under the hood" page), the assistant (8000), the mock provider (4100,
# the demo's bank buttons) and DNS. Nothing else, and no internet.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: web
spec:
  podSelector:
    matchLabels:
      app: web
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - ports:
        - port: http
          protocol: TCP
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: api
      ports:
        - port: 3000
          protocol: TCP
        - port: 9100
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app: agent
      ports:
        - port: 8000
          protocol: TCP
    # Step 7g: the live assistant's rate limiter.
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - port: 6379
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app: mock-provider
      ports:
        - port: 4100
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
