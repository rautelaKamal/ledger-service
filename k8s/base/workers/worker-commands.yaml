# Outbox worker, commands lane: provider.* rows (a user is waiting on these).
# Same image as the api, different command and WORKER_LANE. One replica is
# plenty: a payment is one HTTP call to the provider.
#
# No preStop sleep here, unlike the api: nothing routes requests TO a worker,
# so there is no routing to wait for. SIGTERM straight away; the worker
# finishes the row it is on, commits, and exits (src/worker/main.ts).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-commands
  labels:
    app: worker-commands
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: worker-commands
  template:
    metadata:
      labels:
        app: worker-commands
    spec:
      # The handler timeout is 10 s; the worker stops within one handler.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: ledger-service
          imagePullPolicy: IfNotPresent
          command: ["node", "dist/src/worker/main.js"]
          ports:
            # /healthz, /readyz and /metrics all live here. Internal only.
            - name: metrics
              containerPort: 9101
          envFrom:
            - configMapRef:
                name: worker-config
          env:
            - name: WORKER_LANE
              value: commands
            - name: WORKER_CONCURRENCY
              value: "1"
            - name: SERVICE_NAME
              value: worker-commands
            - name: WORKER_DATABASE_URL
              valueFrom: { secretKeyRef: { name: ledger-secrets, key: WORKER_DATABASE_URL } }
          startupProbe:
            httpGet: { path: /healthz, port: metrics }
            periodSeconds: 2
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /readyz, port: metrics }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          livenessProbe:
            httpGet: { path: /healthz, port: metrics }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 160Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
# Headless Service so Prometheus can find each worker pod by DNS.
apiVersion: v1
kind: Service
metadata:
  name: worker-commands
  labels:
    app: worker-commands
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: worker-commands
  ports:
    - name: metrics
      port: 9101
      targetPort: metrics
