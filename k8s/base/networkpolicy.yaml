# Who may talk to the metrics ports: Prometheus, and nobody else.
#
# A NetworkPolicy is a firewall rule for pods. Once a pod is selected by ANY
# policy, every incoming connection that no policy allows is dropped. So each
# policy below must list everything its pods legitimately receive:
#
#   api      port 3000 from anyone (that is the product), port 9100 from Prometheus
#   workers  port 9101 from Prometheus only (nothing else ever calls a worker)
#
# Enforcement is the network plugin's job; kind's (kindnet) enforces these, and
# scripts/k8s/smoke.sh proves it by trying from a pod that is not Prometheus.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api
spec:
  podSelector:
    matchLabels:
      app: api
  policyTypes: ["Ingress"]
  ingress:
    - ports:
        - port: http
          protocol: TCP
    - from:
        - podSelector:
            matchLabels:
              app: prometheus
      ports:
        - port: metrics
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: workers
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: ["worker-commands", "worker-events"]
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: prometheus
      ports:
        - port: metrics
          protocol: TCP
