# Non-secret configuration. Anything with a password or a signing key is in the
# Secret `ledger-secrets` (created by scripts/k8s/secrets.sh, never committed).
#
# Service names are stable DNS names inside the namespace: `postgres`, `api`,
# `mock-provider`. Pods come and go; these names do not.
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
data:
  PORT: "3000"
  # /metrics is served ONLY here, on a port the public Service does not expose.
  METRICS_PORT: "9100"
  SERVICE_NAME: api
  LOG_LEVEL: info
  # In-flight requests get this long to finish after SIGTERM. Must fit inside
  # terminationGracePeriodSeconds (40) together with the preStop sleep (5).
  SHUTDOWN_GRACE_MS: "25000"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: worker-config
data:
  PROVIDER_URL: http://mock-provider:4100
  NOTIFICATION_SINK_URL: http://mock-provider:4100/notifications
  WORKER_HTTP_PORT: "9101"
  WORKER_POLL_INTERVAL_MS: "250"
  LOG_LEVEL: info
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mock-provider-config
data:
  PROVIDER_PORT: "4100"
  LEDGER_WEBHOOK_URL: http://api:3000/webhooks/provider
---
# The assistant (step 7). The API key and LangSmith settings are in the Secret
# agent-secrets (scripts/k8s/secrets.sh, from agent/.env).
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-config
data:
  PORT: "8000"
  AGENT_METRICS_PORT: "9102"
  AGENT_MODEL: gemini-3.5-flash-lite
  AGENT_EMBEDDING_MODEL: gemini-embedding-2
  AGENT_EMBEDDING_DIMENSIONS: "768"
  AGENT_DAILY_LIMIT: "20"
  # No home directory in the image; libraries that cache go to /tmp (an emptyDir).
  HOME: /tmp
---
# The web app (step 7d). URLs are cluster DNS names; the browser never sees them.
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-config
data:
  PORT: "3200"
  HOSTNAME: 0.0.0.0
  LEDGER_API_URL: http://api:3000
  LEDGER_INTERNAL_URL: http://api-metrics:9100
  AGENT_URL: http://agent:8000
  PROVIDER_URL: http://mock-provider:4100
  # 'agent' (step 7g): free-text questions go to the live assistant, inside the limits
  # below (kept in Redis, shared by both web replicas). Over Gemini's quota, or with
  # Redis down, a script answers and the answer is labelled as such.
  # 'fixtures': the script answers everything, no model call.
  ASSISTANT_MODE: agent
  REDIS_URL: redis://redis:6379
  # Per visitor: 5 in a row, then one every 3 minutes. All visitors: 40 per Gemini
  # quota day (at most 320 model calls). See docs/STEP-07G-EXPLAINED.md.
  ASSISTANT_BURST: "5"
  ASSISTANT_REFILL_SECONDS: "180"
  ASSISTANT_DAILY_CAP: "40"
  # True here, and only here: reconcile-cronjob.yaml runs "0 2 * * *" in Asia/Kolkata.
  # Keep the two in step; compose sets no schedule because it has no such job.
  RECONCILE_SCHEDULE: every night at 02:00 IST
