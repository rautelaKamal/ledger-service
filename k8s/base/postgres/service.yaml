# "Headless" (clusterIP: None): DNS for `postgres` resolves straight to the pod,
# with no virtual IP in between. A StatefulSet needs one of these (serviceName);
# for a single database pod there is nothing to load-balance anyway.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
