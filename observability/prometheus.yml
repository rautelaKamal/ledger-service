# Prometheus pulls ("scrapes") /metrics from each target every 5 seconds.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["api:3000"]

  # One target per lane worker. Both expose the same database-backed outbox
  # gauges, so dashboards take max() of those and sum() of per-process counters.
  # (No target label called "lane" here: the metrics already carry their own
  # `lane` label, and a clashing target label would rename it to exported_lane.)
  - job_name: worker
    static_configs:
      - targets: ["worker-commands:9101", "worker-events:9101"]
