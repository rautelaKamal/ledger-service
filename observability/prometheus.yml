# Prometheus pulls ("scrapes") /metrics from each target every 5 seconds.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["api:3000"]

  # One target per lane; both expose the same database-backed outbox gauges,
  # so dashboards take max() of those and sum() of the per-process counters.
  - job_name: worker
    static_configs:
      - targets: ["worker-commands:9101"]
        labels: { lane: commands }
      - targets: ["worker-events:9101"]
        labels: { lane: events }
